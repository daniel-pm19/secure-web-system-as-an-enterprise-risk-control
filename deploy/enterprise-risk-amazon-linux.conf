<VirtualHost *:80>
    ServerName daniel-risk-lab.duckdns.org
    RewriteEngine On
    DocumentRoot /var/www/enterprise-risk-frontend
    <Directory /var/www/enterprise-risk-frontend>
        Options -Indexes
        AllowOverride None
        Require all granted
        RewriteEngine On
        RewriteCond %{REQUEST_URI} !^/api(?:/|$)
        RewriteCond %{REQUEST_URI} !^/.well-known/acme-challenge/
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ /index.html [L]
    </Directory>
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyPass /api/ http://127.0.0.1:8080/api/
    ProxyPassReverse /api/ http://127.0.0.1:8080/api/
    RequestHeader unset X-Forwarded-Proto
    RequestHeader set X-Forwarded-Proto "expr=%{REQUEST_SCHEME}"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    ErrorLog /var/log/httpd/enterprise-risk-error.log
    CustomLog /var/log/httpd/enterprise-risk-access.log "%t %m %U %>s %D"
</VirtualHost>
