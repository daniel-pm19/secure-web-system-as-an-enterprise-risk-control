spring.config.import=optional:file:.env[.properties]
spring.application.name=enterprise-risk-api
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH0_ISSUER_URI:https://YOUR_TENANT.us.auth0.com/}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH0_JWK_SET_URI:https://YOUR_TENANT.us.auth0.com/.well-known/jwks.json}
spring.security.oauth2.resourceserver.jwt.audiences=${AUTH0_AUDIENCE:https://enterprise-risk-api}
app.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}
server.address=127.0.0.1
server.port=8080
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.directory=${ACCESS_LOG_DIR:logs}
server.tomcat.accesslog.pattern=%t %m %U %s %D
